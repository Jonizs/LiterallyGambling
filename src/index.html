<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Literally Gambling — Forge</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div class="game" id="game">
  <div class="frame">

    <aside class="sidebar">
      <div class="plate nameplate">
        <div class="name-row">
          <span class="player-name" id="player-name">SMITH</span>
          <button class="chip" id="btn-profile">Profile</button>
        </div>
        <div class="player-title">Apprentice blacksmith</div>
      </div>

      <div class="xp-row">
        <div class="xp-track">
          <div class="xp-fill" id="xp-fill"></div>
        </div>
        <div class="level-medallion">
          <span class="lvl-label">lvl</span>
          <span class="lvl-value" id="lvl-value">5</span>
        </div>
      </div>

      <div class="purse" id="purse"></div>

      <section class="plate group">
        <button class="wood-btn wide" id="scene-btn" data-panel="forge">FORGE</button>
      </section>

      <section class="plate group">
        <h2 class="tab-title small">Workstations</h2>
        <button class="wood-btn small wide" data-home="forge"
          data-room="forge">FORGE</button>
        <button class="wood-btn small wide" data-home="lab"
          data-room="lab">RESOURCE &amp; EXPERIMENT</button>
        <button class="wood-btn small wide" data-home="enchant"
          data-room="enchant">ENCHANTING</button>
        <button class="wood-btn small wide" data-home="polish"
          data-room="polish">POLISH</button>
        <button class="wood-btn small wide" data-home="awaken"
          data-room="awaken">AWAKEN</button>
      </section>

      <button class="wood-btn wide options" data-panel="options">OPTIONS</button>
    </aside>

    <main class="scene">
      <canvas id="forge-canvas" width="256" height="160" aria-label="Blacksmith forge"></canvas>

      <!-- The buffs hang in the scene itself, a board nailed to the wall. -->
      <section class="billboard" id="buff-board" aria-label="Forge buffs">
        <div class="board-head">FORGE BUFFS</div>
        <div class="buff-grid" id="buff-grid"></div>
      </section>
      <button class="strike-btn idle" id="strike-btn" type="button" disabled>FORGE!</button>

      <!-- Pressing a fitting that does more than one thing slides its bars
           out of the furniture itself. -->
      <div class="spot-bars" id="spot-bars" hidden></div>

      <!-- Some menus belong to the room rather than the screen: the bench
           panel hangs on the wall over the fitting it works. -->
      <div class="bench-panel" id="bench-panel" hidden>
        <div class="bench-head">
          <span id="bench-title"></span>
          <button class="bench-close" id="bench-close" type="button">CLOSE</button>
        </div>
        <div class="bench-body" id="bench-body"></div>
      </div>

      <!-- The enchanting ritual: the piece hangs over the table, the table
           throws runes, and the three offers come up around it. -->
      <div class="ritual" id="ritual" hidden>
        <div class="ritual-sparks" id="ritual-sparks"></div>
        <div class="ritual-item" id="ritual-item"></div>
        <div class="ritual-choices" id="ritual-choices"></div>
      </div>

      <div class="reveals" id="reveals" aria-live="polite"></div>

      <div class="pick-hint" id="pick-hint" hidden></div>

      <!-- A new playthrough asks who is at the anvil before anything else. -->
      <div class="popup" id="name-pop" hidden>
        <div class="plate popup-card">
          <div class="popup-head">Who works this forge?</div>
          <div class="popup-note">The name over the anvil. You can pick anything.</div>
          <input class="name-input" id="name-input" type="text" maxlength="14"
            autocomplete="off" spellcheck="false" aria-label="Smith name">
          <div class="popup-actions">
            <button class="mini-btn strong" id="name-go" type="button">TAKE THE HAMMER</button>
          </div>
        </div>
      </div>

      <div class="popup" id="result-pop" hidden>
        <div class="plate popup-card">
          <div class="popup-head">Pulled from the coals</div>
          <div class="popup-icon" id="pop-icon"></div>
          <div class="popup-name" id="pop-name"></div>
          <div class="popup-stats" id="pop-stats"></div>
          <div class="popup-note" id="pop-note" hidden></div>
          <div class="popup-actions">
            <button class="mini-btn strong" id="pop-close" type="button">TAKE IT</button>
            <button class="mini-btn" id="pop-sell" type="button">SELL</button>
          </div>
        </div>
      </div>

      <div class="popup" id="discover-pop" hidden>
        <div class="plate popup-card">
          <div class="popup-head">Discovered</div>
          <div class="discover-box">
            <div class="discover-spin" id="discover-icon"></div>
          </div>
          <div class="popup-name" id="discover-name"></div>
          <div class="popup-note">It is on the anvil now.</div>
          <div class="popup-actions">
            <button class="mini-btn strong" id="discover-close" type="button">TO THE ANVIL</button>
          </div>
        </div>
      </div>

      <div class="overlay" id="overlay" hidden>
        <div class="plate overlay-card">
          <div class="overlay-head">
            <h2 class="tab-title" id="overlay-title">Forge</h2>
            <button class="chip" id="overlay-close">Close</button>
          </div>
          <div class="overlay-body" id="overlay-body"></div>
        </div>
      </div>
    </main>

  </div>
  <div class="tooltip" id="tooltip" hidden></div>
</div>
<script src="stats.js"></script>
<script src="icons.js"></script>
<script src="artifacts.js"></script>
<script src="parts.js"></script>
<script src="recipes.js"></script>
<script src="game.js"></script>
<script src="enchants.js"></script>
<script src="sand.js"></script>
<script src="parttiers.js"></script>
<script src="upgrades.js"></script>
<script src="gather.js"></script>
<script src="batch.js"></script>
<script src="refine.js"></script>
<script src="compound.js"></script>
<script src="save.js"></script>
<script src="panels.js"></script>
<script src="resource.js"></script>
<script src="inventory.js"></script>
<script src="experiment.js"></script>
<script src="enchant.js"></script>
<script src="artifact.js"></script>
<script src="forge.js"></script>
<script src="shelf.js"></script>
<script src="rooms.js"></script>
<script src="shrine.js"></script>
<script src="grind.js"></script>
<script src="ui.js"></script>
</body>
</html>
